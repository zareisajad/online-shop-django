{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <title>{% if title %} {{ title }} {% else %} Django Online Shop {% endif %}</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signup-container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: none;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 25px 0;
            border-bottom: none;
        }
        .card-header h3 {
            margin-bottom: 0;
            font-weight: 600;
        }
        .card-body {
            padding: 30px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 30px;
            padding: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #667eea;
            font-weight: 500;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .card-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        /* Phone input styling - Fixed version */
        .phone-input-container {
            display: flex;
            position: relative;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            overflow: hidden;
            margin-bottom: 1rem;
            background-color: #fff;
        }
        .country-code-select {
            flex: 0 0 auto;
            width: 110px;
            border: none;
            background-color: #f8f9fa;
            padding: 0.375rem 0.75rem;
            text-align: center;
            direction: ltr;
            border-right: 1px solid #ced4da;
        }
        .phone-number-input {
            flex: 1 1 auto;
            border: none;
            padding: 0.375rem 0.75rem;
            text-align: left;
        }
        .phone-number-input:focus, .country-code-select:focus {
            outline: none;
            box-shadow: none;
        }
        .phone-input-container:focus-within {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        /* Fix for crispy forms */
        #div_id_country_code, #div_id_phone_number {
            display: none;
        }
        .custom-phone-container {
            margin-bottom: 1.5rem;
        }
        .custom-phone-container label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #495057;
        }
        /* Pulse animation for button */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        .pulse {
            animation: pulse 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container signup-container">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-user-plus card-icon"></i>
                <h3>ثبت نام</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- Hidden original fields that will be populated by our custom UI -->
                    <div style="display: none;">
                        {{ form.country_code }}
                        {{ form.phone_number }}
                    </div>
                    
                    <!-- Custom phone input UI -->
                    <div class="custom-phone-container">
                        <label for="custom-phone-number">شماره تلفن</label>
                        <div class="phone-input-container">
                            <select id="custom-country-code" class="country-code-select">
                                <option value="+98">ایران (+98)</option>
                                <option value="+1">USA (+1)</option>
                                <option value="+44">UK (+44)</option>
                                <option value="+971">UAE (+971)</option>
                                <option value="+90">Turkey (+90)</option>
                                <option value="+49">Germany (+49)</option>
                                <option value="+33">France (+33)</option>
                                <option value="+39">Italy (+39)</option>
                                <option value="+7">Russia (+7)</option>
                                <option value="+86">China (+86)</option>
                                <option value="+91">India (+91)</option>
                            </select>
                            <input type="tel" id="custom-phone-number" class="phone-number-input" 
                                   placeholder="شماره تلفن بدون کد کشور" dir="ltr">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <button class="btn btn-primary btn-block" type="submit">
                            <i class="fas fa-paper-plane mr-2"></i>ارسال کد تایید
                        </button>
                    </div>
                </form>
                <div class="login-link">
                    <small>
                        قبلا ثبت نام کردی؟ <a href="{% url 'accounts:login' %}">ورود</a>
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap 4 JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            // Sync custom UI with hidden form fields
            $('#custom-country-code').on('change', function() {
                $('#id_country_code').val($(this).val());
            });
            
            $('#custom-phone-number').on('input', function() {
                $('#id_phone_number').val($(this).val());
            });
            
            // Initialize with default values
            $('#custom-country-code').val('+98');
            $('#id_country_code').val('+98');
            
            // Form submission handling
            $('form').on('submit', function() {
                // Ensure hidden fields are populated with custom UI values
                $('#id_country_code').val($('#custom-country-code').val());
                $('#id_phone_number').val($('#custom-phone-number').val());
                
                // Validate phone number format
                const phoneNumber = $('#custom-phone-number').val();
                if (!phoneNumber || phoneNumber.trim() === '') {
                    alert('لطفا شماره تلفن خود را وارد کنید');
                    return false;
                }
                
                // Basic validation - only digits
                if (!/^\d+$/.test(phoneNumber.replace(/[\s-]/g, ''))) {
                    alert('شماره تلفن باید فقط شامل اعداد باشد');
                    return false;
                }
                
                return true;
            });
            
            // Add animation to button
            $('.btn-primary').hover(
                function() { $(this).addClass('pulse'); },
                function() { $(this).removeClass('pulse'); }
            );
        });
    </script>
</body>
</html>
