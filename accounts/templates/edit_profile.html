{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4">
        <div class="card-body">
          <!-- اطلاعات کاربر -->
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle mb-3" style="width: 80px; height: 80px;">
              <i class="bi bi-person-circle fs-1 text-muted"></i>
            </div>
            <h5 class="mb-1">{{ user.phone_number }}</h5>
            <p class="text-muted small">عضویت از: {{user.created_at|date:"Y/m/d"}}</p>
          </div>
          
          <!-- فرم ویرایش پروفایل -->
          <form method="POST">
            {% csrf_token %}
            <h5 class="mb-3 d-flex align-items-center">
              <i class="bi bi-pencil-square me-2 text-primary"></i>
              ویرایش پروفایل
            </h5>
            <hr class="mb-4">
            
            {{ form|crispy }}
            
            <div class="form-group">
              <button class="btn btn-primary mt-4 w-100 py-2 rounded-3" type="submit">
                <i class="fas fa-save me-2"></i>ذخیره تغییرات
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
