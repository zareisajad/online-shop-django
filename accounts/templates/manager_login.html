{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4">
        <div class="card-body">
          <!-- لوگو و عنوان -->
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle mb-3" style="width: 70px; height: 70px;">
              <i class="bi bi-shop fs-1 text-muted"></i>
            </div>
            <h4 class="mb-1">ورود به پنل مدیریت</h4>
            <p class="text-muted small">لطفا اطلاعات خود را وارد کنید</p>
          </div>
          
          <!-- فرم ورود -->
          <form method="POST">
            {% csrf_token %}
            
            <!-- استفاده از crispy forms -->
            {{ form|crispy }}
            
            <!-- دکمه ورود -->
            <div class="form-group">
              <button class="btn btn-primary mt-3 w-100 py-2 rounded-3" type="submit">
                <i class="fas fa-sign-in-alt me-2"></i>ورود به داشبورد
              </button>
            </div>
          </form>
          
          <!-- لینک بازگشت به فروشگاه -->
          <div class="border-top pt-3 mt-3 text-center">
            <p class="text-muted mb-0">
              <a class="text-decoration-none" href="{% url 'shop:home_page' %}">
                <i class="bi bi-arrow-left me-1"></i>بازگشت به فروشگاه
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
